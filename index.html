<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Animal Tales</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    color: #222;
    overflow: hidden;
}

body { background: #fff; }

.page {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.watermark {
    position: fixed;
    inset: 0;
    background-image: url("Series/World Animal Tales Logo.png"), url("Series/World Animal Tales Logo.png"), url("Series/World Animal Tales Logo.png");
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-position: left 90%, center 90%, right 90%;
    background-size: 500px 500px, 500px 500px, 500px 500px;
    filter: saturate(65%);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
}

.content {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 8px 18px 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 150px;
    flex-shrink: 0;
}

.author-side,
.logo-side {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.author-photo {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    flex-shrink: 0;
}

.author-name,
.logo-name {
    text-align: center;
    margin-top: 8px;
    font-size: 18px;
    font-weight: 600;
}

.statement {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    max-width: 700px;
    text-align: center;
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    flex-shrink: 0;
}

.language-option,
.book-option,
.site-option {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    cursor: pointer;
}

input[type="radio"] {
    cursor: pointer;
    margin: 0;
}

#selectionArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 35px;
    flex: 1;
    min-height: 0;
    margin-top: 150px;
}

.selection-column {
    min-width: 210px;
    max-width: 330px;
}

.selection-column.book-column {
    min-width: 300px;
}

.column-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.book-option {
    line-height: 1.25;
    margin: 0;
    padding: 1px 0;
}

.language-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 5px 18px;
}

.site-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(100px, 1fr));
    gap: 3px 14px;
}

#bookLanguageColumn {
    min-width: 500px;
    max-width: 760px;
}


/* =========================================================
   WORLD ANIMAL TALES SERIES LANGUAGE MENU
   ========================================================= */

.series-menu {
    position: relative;
    display: inline-block;
}

.series-logo-button {
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
}

.series-logo-button:hover .logo {
    transform: scale(1.03);
}

.series-language-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 190px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    padding: 8px;
    z-index: 1000;
}

.series-language-menu a {
    display: block;
    padding: 9px 12px;
    color: #444;
    text-decoration: none;
    border-radius: 6px;
    font-size: 15px;
    white-space: nowrap;
}

.series-language-menu a:hover {
    background: #f0f0f0;
}

.series-language-menu.show {
    display: block;
}

.hidden {
    display: none !important;
}

.special-thanks {
    flex-shrink: 0;
    margin-top: 0;
    padding: 5px 0 8px;
    text-align: center;
    font-size: 13px;
    line-height: 1.2;
}

/* NEW STORE AND CONTEXT-SENSITIVE NAVIGATION */
#selectionArea {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 22px 28px;
    margin-top: 42px;
    overflow-y: auto;
    padding: 0 12px 10px;
}

#selectionArea > .navigation-panel {
    flex: 0 0 100%;
    width: 100%;
}

#selectionArea > .selection-column {
    flex: 0 0 auto;
    align-self: flex-start;
}

#selectionArea > .book-column {
    width: 300px;
}

#selectionArea > #bookLanguageColumn {
    width: min(620px, 55vw);
    min-width: 420px;
    max-width: 760px;
}

#selectionArea > #siteColumn {
    width: 300px;
}

.navigation-panel {
    width: min(1100px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
}

.navigation-status {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.available-row {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.available-row strong {
    white-space: nowrap;
}

.store-choices,
.navigation-choices {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
}

.store-choice,
.navigation-choice {
    border: 1px solid #777;
    border-radius: 7px;
    background: rgba(255,255,255,0.92);
    color: #222;
    padding: 8px 18px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.store-choice:hover,
.navigation-choice:hover {
    background: #eeeeee;
}

.navigation-status {
    width: min(760px, 100%);
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 15px;
}

.status-line {
    display: grid;
    grid-template-columns: 165px 1fr;
    gap: 12px;
    align-items: baseline;
}

.status-line strong {
    white-space: nowrap;
}

.navigation-choices {
    justify-content: flex-start;
    margin-left: 177px;
    min-height: 0;
}

.data-pending {
    font-size: 14px;
    font-style: italic;
    max-width: 420px;
}

@media (max-width: 700px) {
    #selectionArea { margin-top: 20px; }
    .status-line { grid-template-columns: 1fr; gap: 2px; }
    .navigation-choices { margin-left: 0; }
    #selectionArea { align-items: flex-start; }
    .navigation-panel { align-items: stretch; }
    #selectionArea > .book-column,
    #selectionArea > #bookLanguageColumn,
    #selectionArea > #siteColumn {
        width: 100%;
        min-width: 0;
        max-width: none;
    }
}

#availableOptionsLabel { white-space: nowrap; }
</style>
</head>

/* Website language labels (the website itself remains English).
   A label does not create an edition; only populated catalogue identifiers are offered. */
const languageNames = {
    en: "English",
    hi: "Hindi",
    es: "Spanish",
    fr: "French",
    pt: "Portuguese",
    ar: "Arabic",
    zh: "Traditional Chinese",
    de: "German",
    ja: "Japanese",
    it: "Italian",
    nl: "Dutch",
    af: "Afrikaans",
    pa: "Punjabi",
    th: "Thai",
    ko: "Korean",
    mi: "Māori",
    "zh-CN": "Simplified Chinese",
    bn: "Bengali",
    el: "Greek",
    cs: "Czech",
    ro: "Romanian",
    sk: "Slovakian",
    ne: "Nepalese"
};

/* Amazon regional stores — original V10 list retained verbatim. */
const amazonSites = [
    { code:"us", name:"US", domain:"amazon.com" },

    { code:"uk", name:"UK", domain:"amazon.co.uk" },

    { code:"de", name:"Germany", domain:"amazon.de" },

    { code:"fr", name:"France", domain:"amazon.fr" },

    { code:"es", name:"Spain", domain:"amazon.es" },

    { code:"it", name:"Italy", domain:"amazon.it" },

    { code:"nl", name:"Netherlands", domain:"amazon.nl" },

    { code:"jp", name:"Japan", domain:"amazon.co.jp" },

    { code:"br", name:"Brazil", domain:"amazon.com.br" },

    { code:"ca", name:"Canada", domain:"amazon.ca" },

    { code:"mx", name:"Mexico", domain:"amazon.com.mx" },

    { code:"au", name:"Australia", domain:"amazon.com.au" },

    { code:"in", name:"India", domain:"amazon.in" }
];

const koboBaseURL = "https://www.kobo.com/ebook/";
function getKoboURL(edition) {
    if (edition.koboCode) return koboBaseURL + edition.koboCode;
    return edition.koboURL || "";
}

const formatLabels = {
    ebooks: "E-books",
    paperbacks: "Paperback",
    hardcopies: "Hardcopy",
    colouringBooks: "Colouring Book"
};
const formatOrder = ["ebooks", "paperbacks", "hardcopies", "colouringBooks"];

let selectedStore = null;
let selectedType = "individual";
let selectedFormat = "ebooks";
let selectedPublication = null;
let selectedLanguage = null;

function getLanguageName(code) {
    return languageNames[code] || code;
}
function getEditions(publication, format=selectedFormat) {
    return (publication.formats && publication.formats[format]) || [];
}
function editionsForStore(publication, format=selectedFormat) {
    const editions = getEditions(publication, format);
    if (selectedStore === "Amazon") return editions.filter(e => !!e.amazonASIN);
    if (selectedStore === "Kobo") return editions.filter(e => !!e.koboCode || !!e.koboURL);
    return [];
}
function availableFormats(type) {
    return formatOrder.filter(format => publications.some(p =>
        p.type === type && editionsForStore(p, format).length > 0
    ));
}
function clearPurchaseColumns() {
    document.getElementById("bookLanguageColumn").classList.add("hidden");
    document.getElementById("siteColumn").classList.add("hidden");
    document.getElementById("bookLanguageList").innerHTML = "";
    document.getElementById("siteList").innerHTML = "";
}
function clearSelection() {
    selectedPublication = null;
    selectedLanguage = null;
    clearPurchaseColumns();
}
function setColumnHeading(id, value) {
    const el = document.getElementById(id);
    const heading = el ? el.closest(".selection-column").querySelector("h3") : null;
    if (heading) heading.textContent = value;
}
function showMessage(message) {
    const el = document.getElementById("purchaseMessage");
    el.textContent = message;
    el.classList.remove("hidden");
}
function hideMessage() {
    document.getElementById("purchaseMessage").classList.add("hidden");
}
function renderNavigation() {
    const selected = document.getElementById("selectedOptions");
    const choices = document.getElementById("navigationChoices");
    const label = document.getElementById("availableOptionsLabel");
    const row = document.getElementById("availableRow");
    choices.innerHTML = "";

    const path = [];
    if (selectedStore) path.push(selectedStore);
    if (selectedType === "volume") path.push("Volumes");
    if (selectedStore) path.push(formatLabels[selectedFormat]);
    selected.textContent = path.join(", ");
    document.getElementById("selectedOptionsLabel").classList.toggle("hidden", !path.length);

    let next = [];
    if (selectedStore === "Amazon" && selectedType === "individual") {
        // Volumes are Amazon-only; Kobo is reserved for individual titles.
        next.push("Volumes");
    } else if (selectedStore === "Amazon" && selectedType === "volume") {
        if (selectedStore === "Amazon") {
            const otherFormats = formatOrder.filter(f => f !== selectedFormat);
            next.push(...otherFormats.map(f => formatLabels[f]));
        }
    }
    next.forEach(option => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "navigation-choice";
        button.textContent = option;
        button.addEventListener("click", () => chooseNavigationOption(option));
        choices.appendChild(button);
    });
    const hasOptions = next.length > 0;
    label.classList.toggle("hidden", !hasOptions);
    row.classList.toggle("hidden", !hasOptions);
}
function chooseStore(store) {
    selectedStore = store;
    selectedType = "individual";
    selectedFormat = "ebooks";
    clearSelection();
    hideMessage();
    setColumnHeading("bookList", "Book Titles");
    renderPublications();
    renderNavigation();
}
function chooseNavigationOption(option) {
    if (option === "Volumes") {
        selectedType = "volume";
        selectedFormat = "ebooks";
    } else {
        const match = Object.entries(formatLabels).find(([, label]) => label === option);
        if (!match) return;
        selectedFormat = match[0];
    }
    clearSelection();
    hideMessage();
    setColumnHeading("bookList", selectedType === "volume" ? "Volumes" :
        selectedFormat === "colouringBooks" ? "Colouring Books" : "Book Titles");
    renderPublications();
    renderNavigation();
}
function renderPublications() {
    const container = document.getElementById("bookList");
    container.innerHTML = "";
    const list = publications.filter(p => p.type === selectedType && editionsForStore(p).length);
    if (!list.length) {
        const msg = document.createElement("p");
        msg.className = "data-pending";
        msg.textContent = selectedType === "volume"
            ? "Volume editions in this format will appear here when their publication identifiers are added."
            : "No published editions are currently listed for this format.";
        container.appendChild(msg);
        return;
    }
    list.forEach(publication => {
        const label = document.createElement("label");
        label.className = "book-option";
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "publication";
        radio.value = publication.id;
        radio.checked = selectedPublication === publication.id;
        radio.addEventListener("change", () => {
            if (!radio.checked) return;
            selectedPublication = publication.id;
            selectedLanguage = null;
            hideSites();
            renderLanguages(publication);
        });
        label.appendChild(radio);
        label.appendChild(document.createTextNode(publication.title));
        container.appendChild(label);
    });
}
function renderLanguages(publication) {
    const column = document.getElementById("bookLanguageColumn");
    const container = document.getElementById("bookLanguageList");
    container.innerHTML = "";
    const editions = editionsForStore(publication);
    if (!editions.length) {
        column.classList.add("hidden");
        return;
    }
    editions.forEach(edition => {
        const label = document.createElement("label");
        label.className = "language-option";
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "publicationLanguage";
        radio.value = edition.language;
        radio.checked = selectedLanguage === edition.language;
        radio.addEventListener("change", () => {
            if (!radio.checked) return;
            selectedLanguage = edition.language;
            if (selectedStore === "Kobo") {
                const url = getKoboURL(edition);
                if (url) window.location.href = url;
                else showMessage("The Kobo identifier for this language edition has not yet been entered.");
            } else {
                renderAmazonStores(edition);
            }
        });
        label.appendChild(radio);
        label.appendChild(document.createTextNode(getLanguageName(edition.language)));
        container.appendChild(label);
    });
    column.classList.remove("hidden");
}
function renderAmazonStores(edition) {
    const column = document.getElementById("siteColumn");
    const container = document.getElementById("siteList");
    container.innerHTML = "";
    if (!edition.amazonASIN) {
        column.classList.add("hidden");
        showMessage("The Amazon ASIN for this language edition has not yet been entered.");
        return;
    }
    amazonSites.forEach(site => {
        const label = document.createElement("label");
        label.className = "site-option";
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "amazonSite";
        radio.value = site.code;
        radio.addEventListener("change", () => {
            if (radio.checked) window.location.href = "https://" + site.domain + "/dp/" + edition.amazonASIN;
        });
        label.appendChild(radio);
        label.appendChild(document.createTextNode(site.name));
        container.appendChild(label);
    });
    column.classList.remove("hidden");
}
function hideSites() {
    document.getElementById("siteList").innerHTML = "";
    document.getElementById("siteColumn").classList.add("hidden");
}
function renderText() {
    document.getElementById("statement").textContent =
        "I believe that every Parent and child-reader alike, should be given the pleasure to read in their own language.";
    document.getElementById("specialThanks").textContent =
        "Special Thanks — With special thanks to Hamish Wordsworth for allowing me to recycle this website. As a special thank-you, his children's books are also featured on this page.";
}
function renderAll() {
    renderText();
    clearPurchaseColumns();
    document.getElementById("bookList").innerHTML = "";
    setColumnHeading("bookList", "");
    hideMessage();
    renderNavigation();
}
function toggleSeriesLanguages() {
    document.getElementById("seriesLanguageMenu").classList.toggle("show");
}
window.addEventListener("pageshow", () => {
    selectedStore = null;
    selectedType = "individual";
    selectedFormat = "ebooks";
    clearSelection();
    renderAll();
});
document.addEventListener("click", event => {
    const menu = document.getElementById("seriesLanguageMenu");
    const button = document.querySelector(".series-logo-button");
    if (menu && button && !menu.contains(event.target) && !button.contains(event.target)) menu.classList.remove("show");
});
renderAll();

/* Basic integrity checks: the preserved original ASINs are not overwritten. */
console.info("Unified catalogue loaded:", publications.length, "publications");
</script>
